[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agemem"
version = "0.1.0"
description = "AgeMem: Unified LTM + STM management for LLM agents (arXiv:2601.01885)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Miguel Merlin"},
]
keywords = ["llm", "memory", "reinforcement-learning", "agemem", "grpo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "torchvision>=0.16",
    "torchaudio>=2.1",
    "transformers>=4.43",
    "trl>=0.10",
    "datasets>=2.20",
    "accelerate>=0.30",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "pydantic>=2.0",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]
logging = [
    "wandb>=0.17",
    "tensorboard>=2.16",
]
benchmarks = [
    "alfworld>=0.3",
    "scienceworld>=1.1",
]

[project.scripts]
agemem-train = "hermes.grpo_train:main"
agemem-eval  = "hermes.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require installed external services (e.g., Chroma)",
]
